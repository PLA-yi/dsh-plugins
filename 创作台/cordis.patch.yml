# 安装后左侧栏出现「创作台」，装上就能用。
# dataDir：创作台存数据的地方（设置、素材库、记忆、选题广场），默认在 DSH 自己的目录下。
# 下面两项都可以不写：
#   projectsDir：文章、卡片、视频放在哪个文件夹，默认是「文稿/创作台」。
#   port：插件在后台起的工作台用哪个端口，默认 5295。
- insert:
    - id: creator-studio
      name: '@local/creator-studio'
      config:
        dataDir: !!js dshHomePath('creator-studio')
