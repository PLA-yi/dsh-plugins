# 安装后左侧栏出现「创作台」。插件自带小易工作台（workbench/），装上就能用，不用另外装。
# dataDir：插件自己放临时文件的地方。
# 下面几项都可以不写：
#   projectsDir：文章、卡片放在哪个文件夹，默认是「文稿/创作台」。
#   workbenchDir：要用自己另外装的小易工作台时，写它所在的文件夹（里面有 server.mjs）。
#   port：插件在后台起的工作台用哪个端口，默认 5295，别和你自己开着的工作台（默认 5288）撞上。
- insert:
    - id: creator-studio
      name: '@local/creator-studio'
      config:
        dataDir: !!js dshHomePath('creator-studio')
